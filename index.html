<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ミライ花火 - どこまで届くか。</title>
<link rel="stylesheet" href="style.css">
<!-- defer: HTML を解析し終えてから実行されるので、DOM 取得が空振りしない -->
<script src="script.js" defer></script>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">高度</span>
      <span class="hud-value" id="hud-height">0m</span>
    </div>
    <div class="hud-block right">
      <span class="hud-label">自己ベスト</span>
      <span class="hud-value best" id="hud-best">0m</span>
    </div>
  </div>

  <div class="overlay" id="start-screen">
    <p class="title">ミライ花火</p>
    <p class="subtitle">その一発は、未来まで届くか。</p>
    <button class="btn" id="start-btn">打ち上げる</button>
    <p class="howto">画面を指でなぞって操作（上下にも少しだけ動けます）<br>PC は ← → / A・D、↑ ↓ / W・S<br>画面下の風に流されます。雲・破片・鳥を避けて、少しでも高く。</p>
  </div>

  <div class="overlay hidden" id="result-screen">
    <p class="result-big">到達高度</p>
    <p class="result-num" id="result-height">0m</p>
    <p class="result-best" id="result-best">自己ベスト 0m</p>
    <button class="btn" id="retry-btn">もう一度打ち上げる</button>
  </div>
</div>
</body>
</html>
